name: suivi-temps-reel

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka_container
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - private

  postgres:
    image: postgres:16-alpine
    container_name: postgres_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fleet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fleet"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - private

  notificateur:
    build:
      context: ./notificateur
    container_name: notificateur_container
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fleet
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - private

  simulateur:
    build:
      context: ./simulateur
    container_name: simulator_container
    environment:
      KAFKA_BROKERS: kafka:9092
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - private

  filtrage:
    build:
      context: ./filtrage
    container_name: filter_container
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - private

  api:
    build:
      context: ./api
    container_name: api_container
    environment:
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fleet
      NOTIFIER_URL: http://notificateur:8080
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      notificateur:
        condition: service_started
    restart: unless-stopped
    networks:
      - private

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    container_name: proxy_container
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 support
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      admin:
        condition: service_started
      notificateur:
        condition: service_started
    networks:
      - public
      - private

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: admin_container
    environment:
      PORT: 3000
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
    depends_on:
      notificateur:
        condition: service_started
    restart: unless-stopped
    networks:
      - private


volumes:
  postgres-data:
  caddy_data:
  caddy_config:

networks:
  public :
  private :
    internal: true
