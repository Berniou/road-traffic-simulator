<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Traffic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <main class="admin-shell" data-architecture-visible="false">
      <section class="map-frame" aria-label="Carte de la flotte à Paris (1er au 4e arrondissement)">
        <div id="map" aria-label="Carte OpenStreetMap centrée sur Paris (1er au 4e arrondissement)"></div>
        <div class="map-overlay">
          <header class="admin-panel">
            <h1>Traffic – Vue Admin</h1>
            <p id="connection-status" class="connection-status" data-state="connecting" role="status" aria-live="polite">
              <span class="connection-status__dot" aria-hidden="true"></span>
              <span id="connection-label">Connexion au suivi temps réel…</span>
            </p>
            <p id="message" role="status">Chargement des dernières positions connues…</p>
          </header>
          <button
            id="architecture-toggle"
            class="architecture-toggle"
            type="button"
            aria-controls="architecture-panel"
            aria-expanded="false"
          >
            Afficher le schéma
          </button>
        </div>
        <div class="fleet-panel">
          <button id="fleet-toggle" class="fleet-toggle" type="button" aria-controls="fleet" aria-expanded="true">
            Masquer les véhicules
          </button>
          <ul id="fleet" aria-label="Dernières positions des véhicules"></ul>
        </div>
      </section>
      <aside id="architecture-panel" class="architecture-panel" aria-labelledby="architecture-title" hidden>
        <header class="architecture-panel__header">
          <h2 id="architecture-title">Architecture De L'App</h2>
          <p>Du simulateur à la carte, en flux vertical.</p>
        </header>
        <figure class="architecture-panel__figure">
          <img
            id="architecture-gif"
            class="architecture-panel__gif"
            src="/architecture.gif"
            alt="Schéma vertical de l'architecture : simulateur → Kafka → filtrage → API et PostgreSQL → notificateur WebSocket → vue admin."
          >
          <p id="architecture-fallback" class="architecture-panel__fallback" hidden>
            Déposez le schéma <code>admin/architecture.gif</code> pour l'afficher ici.
          </p>
          <figcaption>
            Simulateur → Kafka → filtrage → API / PostgreSQL → notificateur → vue admin.
          </figcaption>
        </figure>
      </aside>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
